services:
  db:
    image: saik296/library:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: saik296/library:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork

  book_service:
    image: saik296/library:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    image: saik296/library:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  frontend:
    image: saik296/library:frontend
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
        mode: host
    deploy:
      mode: global

networks:
  mynetwork:
    external: true
    name: libraryapp_mynetwork
